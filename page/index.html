<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AGY 令牌管理</title>
    <link rel="stylesheet" href="style.css">
    <script src="_magpie/bridge.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>AGY 令牌管理</h1>
      </header>

      <section class="card" aria-labelledby="import-title">
        <h2 id="import-title">导入 Refresh Token</h2>
        <label for="token">Antigravity Refresh Token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false"
          autocapitalize="none" aria-describedby="token-hint status" required>
        <p id="token-hint" class="hint">复制 JSON 后，在 <b>供应商 → Antigravity（本地 agy CLI）→ 从文件导入账号</b> 粘贴并确认。</p>
        <div class="actions">
          <button id="copy" class="primary" type="button">复制导入 JSON</button>
          <button id="clear" type="button">清空</button>
        </div>
        <p id="status" class="status" role="status"></p>
        <div id="manual" class="manual" hidden>
          <label for="result">导入 JSON</label>
          <textarea id="result" rows="6" readonly spellcheck="false" aria-describedby="status"></textarea>
        </div>
      </section>

      <section class="card" aria-labelledby="export-title">
        <h2 id="export-title">导出 Refresh Token</h2>
        <div class="actions" id="auto-locate" hidden>
          <button id="locate" class="primary" type="button">自动定位 Magpie 账号</button>
        </div>
        <p id="locate-status" class="hint" role="status" hidden>打开本机窗口，按邮箱或 Profile 选中账号后复制。</p>
        <label for="accounts-folder">Magpie AGY 账号目录</label>
        <input type="file" id="accounts-folder" webkitdirectory aria-describedby="folder-hint export-status">
        <p id="folder-hint" class="hint">Windows 默认位置 <code>%USERPROFILE%\.local\state\magpie-agy-bridge\accounts</code>。可以选整个 <code>accounts</code> 目录，也可以直接选其中一个账号目录。</p>
        <div id="profile-picker" hidden>
          <label for="profile">账号目录 ID（Profile）</label>
          <select id="profile"></select>
        </div>
        <div class="actions">
          <button id="export-copy" class="primary" type="button" disabled>复制 RT</button>
          <button id="export-clear" type="button">清空</button>
        </div>
        <p id="export-status" class="status" role="status"></p>
        <div id="export-manual" class="manual" hidden>
          <label for="export-result">Refresh Token</label>
          <textarea id="export-result" rows="2" readonly spellcheck="false" aria-describedby="export-status"></textarea>
        </div>
      </section>
      <p class="hint privacy">令牌在本机处理。复制内容含完整凭据，用完请清理剪贴板。</p>
    </main>
  </body>
</html>
