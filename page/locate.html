<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>定位 Magpie 账号</title>
    <link rel="stylesheet" href="style.css">
    <script src="locate.js" defer></script>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="title">
        <h2 id="title">定位 Magpie 账号</h2>
        <p class="hint">本机窗口会列出带独立 AGY 凭据的 Magpie 账号。选中账号并确认后，RT 会复制到本机剪贴板。</p>
        <div class="actions">
          <button id="pick" class="primary" type="button" data-request="__LOCATOR_NONCE__">打开账号选择窗口</button>
          <button id="back" type="button">返回令牌管理</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>
    </main>
  </body>
</html>
